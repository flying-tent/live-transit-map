name: 定期実行の停止を防ぐ

# GitHub は、60日間リポジトリに動きがないと schedule の実行を止めます。
# 月に1回、空のコミットを入れて止まらないようにします。
on:
  schedule:
    - cron: "17 3 1 * *"   # 毎月1日 12:17（日本時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: 定期実行を維持"
          git push
