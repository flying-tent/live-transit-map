name: 運行情報の更新と公開

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（GitHub の混雑時は遅れることがあります）
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      save_raw:
        description: "各社から受け取った生データを保存する（対応表の調整用）"
        type: boolean
        default: false

# 権限は必要なジョブにだけ渡す（最小権限）
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # このジョブは push しないので、認証情報を残さない

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: 路線図から路線・駅の一覧を作る
        run: |
          mkdir -p build
          node scripts/export_lines.mjs > build/lines.json

      - name: テスト
        run: python -m unittest discover -s tests

      - name: 運行情報を集めて status.json を作る
        env:
          ODPT_CONSUMER_KEY: ${{ secrets.ODPT_CONSUMER_KEY }}
          ODPT_CHALLENGE_KEY: ${{ secrets.ODPT_CHALLENGE_KEY }}
        run: |
          python scripts/update_status.py \
            --lines build/lines.json \
            --out docs/status.json \
            --previous "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/status.json" \
            ${{ inputs.save_raw && '--raw-dir build/raw' || '' }}

      - name: 生データを保存
        if: ${{ inputs.save_raw }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-data
          path: |
            build/raw
            docs/status.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
