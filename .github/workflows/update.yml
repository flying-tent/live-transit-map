name: 運行情報の更新と公開

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（GitHub の混雑時は遅れることがあります）
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      save_raw:
        description: "各社から受け取った生データを保存する（対応表の調整用）"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: 路線図から路線・駅の一覧を作る
        run: |
          mkdir -p build
          node scripts/export_lines.mjs > build/lines.json

      - name: テスト
        run: python -m unittest discover -s tests

      - name: 運行情報を集めて status.json を作る
        env:
          ODPT_CONSUMER_KEY: ${{ secrets.ODPT_CONSUMER_KEY }}
          ODPT_CHALLENGE_KEY: ${{ secrets.ODPT_CHALLENGE_KEY }}
        run: |
          python scripts/update_status.py \
            --lines build/lines.json \
            --out docs/status.json \
            --previous "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/status.json" \
            ${{ inputs.save_raw && '--raw-dir build/raw' || '' }}

      - name: 生データを保存
        if: ${{ inputs.save_raw }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-data
          path: |
            build/raw
            docs/status.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
